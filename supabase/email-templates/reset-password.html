<!-- Supabase → Authentication → Emails → Templates → "Reset Password"
     Asunto sugerido: Tu código para cambiar la contraseña de Strim -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #111;">
  <h2 style="margin: 0 0 16px;">Cambia tu contraseña de Strim</h2>
  <p style="margin: 0 0 16px;">Escribe este código en la app para elegir una contraseña nueva:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="margin: 0; color: #666; font-size: 13px;">Vence en 10 minutos. Si no pediste el cambio, ignora este correo: tu contraseña sigue igual.</p>
</div>
